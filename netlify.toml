[build]
  publish = "apps/web"

[build.environment]
  # These values are public operational config, not secrets. Keep real secrets
  # such as SUPABASE_SERVICE_ROLE_KEY and RESEND_API_KEY protected by Netlify scan.
  SECRETS_SCAN_OMIT_KEYS = "DRY_RUN_FOLLOWUP_STATUS,OPERON_FROM_EMAIL,OPERON_FROM_NAME,OPERON_REPLY_TO,OPERON_INTERNAL_EMAIL"

[[redirects]]
  from = "/quote"
  to = "/quote.html"
  status = 301

[[redirects]]
  from = "/index2.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/floorplan"
  to = "/floorplan.html"
  status = 301

# Visualiser is intentionally hidden until production backend image generation is available.
[[redirects]]
  from = "/visualiser"
  to = "/"
  status = 301

[[redirects]]
  from = "/visualiser.html"
  to = "/"
  status = 301
