# ==================================================
# Deployment system
# main branch → production
# dev branch → preview
# ==================================================

[build]
  command = ""
  publish = "apps/web"

# Ensure all contexts use same publish dir
[context.production]
  command = ""
  publish = "apps/web"

[context.deploy-preview]
  command = ""
  publish = "apps/web"

[context.branch-deploy]
  command = ""
  publish = "apps/web"

# ==================================================
# Redirects (clean URLs)
# ==================================================

[[redirects]]
  from = "/quote"
  to = "/"
  status = 301

[[redirects]]
  from = "/quote.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/index2.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/floorplan"
  to = "/floorplan.html"
  status = 301

# Visualiser intentionally hidden
[[redirects]]
  from = "/visualiser"
  to = "/"
  status = 301

[[redirects]]
  from = "/visualiser.html"
  to = "/"
  status = 301

# ==================================================
# Security Headers
# ==================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ==================================================
# Cache Control
# ==================================================

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
